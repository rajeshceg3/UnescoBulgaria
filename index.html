<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulgarian Heritage | A UNESCO Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div class="noise-overlay"></div>
    <div id="custom-cursor"></div>

    <!-- The dynamic background element -->
    <div class="background-canvas">
        <div class="geometric-pattern"></div>
    </div>

    <!-- Main container that manages the view state -->
    <main id="app-container">

        <!-- Initial view with the interactive orrery -->
        <section id="orrery-view">
            <header class="main-header">
                <h1>Bulgarian Heritage</h1>
                <p>A UNESCO COLLECTION</p><p class="gallery-hint">7 places · Swipe to explore</p>
            </header>
            <div id="heritage-orrery">
                <div class="orrery-core"></div>
                <!-- Site nodes will be injected here by JavaScript -->
            </div>

            <!-- Mobile Optimized View (Hidden on Desktop) -->
            <div id="mobile-cards-view"></div>

            <div id="map-container">
                <div id="map"></div>
            </div>
        </section>

        <!-- Detail view, hidden by default -->
        <section id="detail-view" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <button class="back-button" aria-label="Go back to selection">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="detail-content">
                <div class="detail-image-container">
                    <img id="detail-image" src="" alt="" class="detail-image">
                </div>
                <div class="detail-text">
                    <h2 id="detail-title"></h2>
                    <div class="detail-meta">
                        <span id="detail-type"></span>
                        <span id="detail-year"></span>
                    </div>
                    <p id="detail-description"></p>
                    <h3>Significance</h3>
                    <p id="detail-significance"></p>
                    <a href="#" id="detail-link" target="_blank" rel="noopener noreferrer">Read more on the UNESCO website</a>
                </div>
            </div>
            <div class="user-contributions">
                <h3>Your field notes</h3><p class="notes-explainer">Saved in this browser only. Nothing is posted or shared.</p>
                <div id="contributions-container"></div>
                <form id="contribution-form">
                    <h4>Add a note</h4>
                    <label for="contribution-name">Name</label><input type="text" id="contribution-name" placeholder="Your Name" required>
                    <label for="contribution-story">Note</label><textarea id="contribution-story" placeholder="Your Story" required></textarea>
                    <label for="contribution-image">Image URL (optional)</label><input type="url" id="contribution-image" placeholder="Image URL (optional)">
                    <button type="submit">Save on this device</button><p id="note-status" role="status"></p>
                </form>
            </div>
        </section>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="vendor/maplibre/maplibre-gl-csp.js"></script>
    <script src="vendor/maplibre/leaflet-maplibre-gl.js"></script>
    <script src="vendor/warm-map/style.js"></script>
    <script src="script.js"></script>
    <script src="map.js"></script>
</body>
</html>
